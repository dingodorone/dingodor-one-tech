<main id="contenu" class="article-wrap"><header class="article-head"><a class="back" href="/articles.html">← Tous les articles</a><h1>Comment créer une sirène puissante pour son alarme xiaomi?</h1><p class="meta"><time datetime="2020-09-02">2020-09-02</time></p></header><article id="wp-content" class="wp-content">
<figure id="m_-6818045771322225377itemcontentlist" class="wp-block-table"><table><tbody><tr><td>Vous êtes nombreux à vouloir augmenter le son de votre gateway xiaomi (et surtout à me demander une solution ) car le volume de l&#8217;alarme reste assez faible. Tout en bas de l&#8217;article, j&#8217;ai rajouté une scène&nbsp;qui va vous être utile. Fonctionne aussi pour la domotique Tuya et autres .<br><br><strong>Le matériel qu&#8217;il faut (Budget de plus ou moins 20€ si vous achetez sur aliexpress)</strong><br><strong>&#8211; Une&nbsp;sirène</strong><br><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/7f042-htb12zssspxxxxazxpxxq6xxfxxxm.jpg"><br><strong>&#8211; Un transformateur 12Volt-36W &#8211; 3A</strong><br><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/6ae7f-htb1qwk7a4sybunjsspjq6x73vxap.jpg"><br><strong>&#8211; Un câble avec sa prise</strong><br><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/57891-htb10kteagjn8kjjszfgq6zjbvxa6.jpg"><br><strong>&#8211; Une prise connectée Xiaomi version Zigbee</strong><br><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/42920-htb1dz.3sfxxxxxyxvxxq6xxfxxxx.jpg" target="_blank"></a><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/ae7db-htb1dz.3sfxxxxxyxvxxq6xxfxxxx.jpg"><br><br>Nouvelle prise xiaomi avec prise terre compatible google et alexa attention serveur européen et non Chine<br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/_dTvVvAi" target="_blank">Achetez ici</a><br><img loading="lazy" height="320" width="320" src="https://ci3.googleusercontent.com/proxy/ga2_4M9VKgj8iHqiwGD1wVnkFGZJLdcP-vYXPDCwdb6GzlboJw6XM8XCYtGWYhE2smItGSiWZPwVLAyDDYqnCE-opMKUEw7nki6c8DWs9BkobTTq=s0-d-e1-ft#https://ae01.alicdn.com/kf/H46731c0f815b4b80bf4e3641a2209458R.jpg"><br><br><br>Pour réaliser cette alarme c&#8217;est très très simple&nbsp;&nbsp;<br>1.Vous devez brancher les files de la&nbsp;sirène&nbsp;sur l&#8217;un des cotés du transformateur et sur l&#8217;autre coté les files de la prise.<br>2.vous devez brancher la prise sur la prise xiaomi .<br><br>Il existe des sonnettes en 220V <a rel="noreferrer noopener" href="https://s.click.aliexpress.com/e/_9IquXu" target="_blank">à voir ici</a> ça évite d&#8217;utiliser un transformateur donc vous pouvez le brancher directement sur la prise . Un Branchement directe de la sirène sur la prise abîmera plus rapidement votre sirène surtout le jour ou elle fonctionnera en continu . <br><br>Après avoir fait ce montage, vous devez créer une scène&nbsp;adaptée par exemple si il y a une détection de mouvement ou bien ouverture de porte, allumer la prise. Quand la prise s&#8217;allumera la&nbsp;sirène&nbsp;va sonner automatiquement. Pour l&#8217;éteindre éteignez la prise xiaomi avec une autres scène&nbsp;via un switch ou via votre smartphone. Voir une scène&nbsp;en bas de l&#8217;article .<br><br><strong>Tuto vidéo possible</strong><br>Si vous désirez un tuto vidéo, je&nbsp;ne&nbsp;suis pas contre mais je&nbsp;ne&nbsp;souhaite pas financer ce tuto par moi même car je n&#8217;ai tout simplement pas l&#8217;utilité de cette alarme supplémentaire.<br>C&#8217;est pour cela que j&#8217;ai crée un compte tipeee qui se trouve&nbsp;<a rel="noreferrer noopener" href="https://fr.tipeee.com/dingodor-one" target="_blank">ici</a>&nbsp;pour financer les objets dont je n&#8217;ai pas l&#8217;utilité et ainsi aider encore plus la communauté.<br><br>Vous comprendrez que je&nbsp;ne&nbsp;peux pas financer tout ce que l&#8217;ont me demande car ont me demande énormément de choses . Je veux bien apporter des solutions mais les financer c&#8217;est autres choses. Bien sûr , si ce projet est financé par vous le matériel sera offert à un membre qui aura besoin de cette alarme car moi j&#8217;en ai pas besoin.<br><br><strong>1. La&nbsp;sirène&nbsp;d&#8217;alarme</strong><br><strong>Sur Aliexpress plusieurs modèles</strong><br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/_s7BBZK" target="_blank">Achète ici avec petite lumière flash</a>&nbsp;<br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/bNybe2MC" target="_blank">Achète ici sirène intérieur</a><br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/_sWSgAU" target="_blank">Achète ici sirène intérieur</a><br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/_rR5gZ6" target="_blank">Achète ici sirène intérieur et extérieur 120dB</a><br><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/_sIPEt2" target="_blank">Achète ici sirène intérieur et extérieur</a><br><br><br><strong>Sur amazon</strong><br>Modèle 110 dB<br><a rel="noreferrer noopener" href="https://amzn.to/2TUZyXt" target="_blank">Achète ici</a><br>Modèle 115dB convient également pour l’extérieur<br><a rel="noreferrer noopener" href="https://amzn.to/2RPAiz3" target="_blank">Achète ici</a><br><br><strong>Sur Banggood&nbsp;</strong><br><a rel="noreferrer noopener" href="https://www.banggood.com/custlink/3vK3dVb0TG" target="_blank">Achète la&nbsp;sirène&nbsp;ici sans lumière</a><br><br><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/30fd9-htb12zssspxxxxazxpxxq6xxfxxxm.jpg" target="_blank"></a><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/be709-htb1e8dat_mwbknjszfbq6xxufxai.jpg" target="_blank"></a><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/f4bbf-htb1e8dat_mwbknjszfbq6xxufxai.jpg"><img loading="lazy" height="136" width="200" src="https://ci3.googleusercontent.com/proxy/9qzALW2aqvXSIkDKhbaMVwiR31an4hvCHw3CeirFKoYtMJZJ56JHgrhyeeOHiY_Kqii9zqTlIH8mSBxGr3yVQqnHAMc_pz2OtKvy84JmpK3REEeo=s0-d-e1-ft#https://ae01.alicdn.com/kf/Hadbae26fcd194059b9c0d7bfb1670857L.jpg" alt="有线小警号_09"><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/7f042- xiaomi ici si il vous faut la gateway V2 et les capteurs</a>&nbsp;<br><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/f1989-htb1nd.olxxxxxaaapxxq6xxfxxxj.jpg"><br><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/8f4e0-htb1nd.olxxxxxaaapxxq6xxfxxxj.jpg" target="_blank"></a><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/e7953-htb1rv4llpxxxxapxxxxq6xxfxxxk.jpg" target="_blank"></a><a rel="noreferrer noopener" href="http://s.click.aliexpress.com/e/Fc0qBVI" target="_blank">Adaptateur pour la prise xiaomi&nbsp;</a>&nbsp;(2.15€ meilleur qualité-prix achète en 2 si tu achète la gateway)<br><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/6fe95-htb1tp1pximnbknjszfcq6x0kfxae.jpg"><br><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/9ee8e-htb1tp1pximnbknjszfcq6x0kfxae.jpg" target="_blank"></a><br><br>Une fois que vous avez fabriqué votre&nbsp;sirène&nbsp;d&#8217;alarme , il va falloir créer un scénario pour que la&nbsp;sirène&nbsp;ne&nbsp;se déclenche pas tout le temps .<br><strong>Attention fonctionne seulement avec les gateway, les passerelles qui ont déjà une&nbsp;sirène&nbsp;intégré .</strong><br>Il faut tout simplement créé&nbsp;une scène&nbsp;qui demande à la prise de s&#8217;allumer seulement quand l&#8217;alarme est activé . On peut aussi rajouter un retard pour qu&#8217;elle&nbsp;ne&nbsp;s&#8217;enclenche pas tout suite .<br><br><a rel="noreferrer noopener" href="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/42340-screenshot_2020-08-31-19-45-20-531_com.xiaomi.smarthome.jpg" target="_blank"></a><img src="https://dingodoronetech.wordpress.com/wp-content/uploads/2020/09/9c79d-screenshot_2020-08-31-19-45-20-531_com.xiaomi.smarthome.jpg"></td></tr></tbody></table></figure>
