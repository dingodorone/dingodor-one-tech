name: Nouvel article
description: Rédiger un article pour Dingodor One Tech
title: "[Article] "
labels: [article]
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire crée un brouillon pour le nouveau site. Il ne publie rien sur WordPress.
  - type: input
    id: title
    attributes:
      label: Titre
      description: Le titre affiché sur dingodoronetech.eu.org.
      placeholder: Exemple : Test de la nouvelle sonnette connectée
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Résumé
      description: Une ou deux phrases pour la liste des articles.
      placeholder: Résume l’article en quelques mots.
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image principale (facultatif)
      description: Colle une URL publique complète qui commence par https://.
  - type: textarea
    id: content
    attributes:
      label: Article
      description: Écris ton texte. Tu peux utiliser des paragraphes, des titres avec ## et des liens Markdown.
      placeholder: |
        Présente le produit ou le sujet ici.

        ## Ce qu’il faut retenir

        Explique les points importants.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: Je comprends que ceci crée un brouillon sur le nouveau site et ne publie rien sur WordPress.
          required: true
