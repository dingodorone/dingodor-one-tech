name: Notifications des nouveaux articles
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dingodor-article-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vérifier les nouveaux articles et notifier les abonnés
        env:
          WEBPUSHR_REST_KEY: ${{ secrets.WEBPUSHR_REST_KEY }}
          WEBPUSHR_AUTH_TOKEN: ${{ secrets.WEBPUSHR_AUTH_TOKEN }}
        run: python3 scripts/notify_new_posts.py
      - name: Enregistrer le dernier article traité
        run: |
          if ! git diff --quiet -- data/last-notified-post.json || [ -n "$(git ls-files --others --exclude-standard data/last-notified-post.json)" ]; then
            git config user.name "dingodor-notifications[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last-notified-post.json
            git commit -m "Mémorise le dernier article notifié"
            git push
          fi
