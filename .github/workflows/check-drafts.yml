name: Vérifier la séparation des brouillons
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: Refuser les dossiers de brouillons dans la branche publique
        run: |
          if git ls-files | grep -Ei '(^|/)(brouillons|drafts|_drafts)/'; then
            echo 'Les brouillons doivent rester exclusivement sur la branche brouillons.'
            exit 1
          fi
